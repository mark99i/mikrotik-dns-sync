name: docker

# Сборка и публикация образа в Docker Hub по CalVer-тегам (26.10.19, 26.10.19-2).
# Тесты — пропускной пункт: битая версия в реестр не попадает.
on:
  push:
    tags: ["[0-9]*"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Юнит-тесты (офлайн, без сети и роутеров)
        run: python -m unittest discover -s tests -t . -v

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Войти в Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Метки и теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mark99i/mikrotik-dns-sync
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
